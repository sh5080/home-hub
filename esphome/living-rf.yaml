# 거실 RF 브리지 (ESP32 #2) — Stage 1: 리모컨 코드 캡처.
#
# STX882(송신) DATA→GPIO4, SRX882(수신) DATA→GPIO5, 둘 다 3.3V/GND.
# 이 펌웨어는 remote_receiver dump:all 로 리모컨 코드를 시리얼 로그에 찍는다.
# 캡처 확정 후 Stage 2에서 remote_transmitter로 재생 + 허브 MQTT 연동.
#
# flash+로그:  esphome run esphome/living-rf.yaml --device /dev/cu.usbserial-110

esphome:
  name: living-rf

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG                 # 캡처 코드가 로그에 뜸

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "living-rf"
captive_portal:

api:                           # 네트워크 로그 스트리밍 (시리얼보다 안정적)

# RF 수신(캡처) — SRX882 DATA → GPIO5
remote_receiver:
  pin:
    number: GPIO5
    mode:
      input: true
  dump: all                    # 모든 프로토콜 + raw 타이밍 덤프
  tolerance: 25%
  filter: 250us
  idle: 4ms
  buffer_size: 2kb

# RF 송신(재생) — STX882 DATA → GPIO4 (캡처 뒤 사용)
remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 100%
