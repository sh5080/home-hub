# E 동글(ZBDongle-E) EZSP 백엔드 개발용 config.
#
#   go run ./cmd/hub --config configs/ezsp-test.yaml
#
# ⚠️ 운영 중인 Pi 브리지와 이름·포트·PIN을 일부러 다르게 뒀다. 같으면 Home 앱에서
# 두 브리지가 충돌한다. 이 설정은 Mac에서 동글을 꽂고 돌리는 개발 전용이다.
homekit:
  name: "Home Hub Dev"
  pin: "01120333"          # 개발용. 운영 PIN을 재사용하지 말 것
  port: "51828"
  storage: "./hap-data-demo"
zigbee:
  port: /dev/cu.usbserial-2140    # ZBDongle-E (Itead). ls /dev/cu.usbserial-* 로 확인
  backend: ezsp
  storage: "./zigbee-data-demo"   # 네트워크 키 기록(0600). git 제외 경로
  permitJoin: false               # 페어링할 때만 true
  # 새 네트워크를 만들 때만 쓰는 채널. 집 WiFi를 실측하고 고를 것 —
  # 2026-09 조사: 우리 WiFi ch10(2447~2467MHz), 옆집 ch2 40MHz(~2397~2437MHz)
  # → Zigbee 15(2425)·20(2450)은 충돌, 25(2475)가 유일하게 깨끗했다.
  channel: 25
  txPower: 20
  # ⚠️ 파괴적: 동글의 기존 네트워크를 버리고 새로 만든다(페어링된 기기 전부 재페어링).
  # 채널을 바꾸는 유일한 방법이라 남겨두지만 평소엔 false.
  # 현재 동글에는 2026-09-02 시험 때 만든 채널 15 네트워크가 들어 있다.
  forceForm: false
mqtt: {listen: ":1884"}           # 운영과 헷갈리지 않게 개발은 1884
devices: []
rules: []
