homekit:
  name: "Home Hub"
  pin: "00102003"             # 8-digit HAP pairing code; change before use
  port: "51826"
  storage: "./hap-data"       # pairing/state persistence

zigbee:
  port: /dev/ttyUSB0          # Zigbee coordinator (CC2652 family)
  storage: "./zigbee-data"    # network + pairing persistence (REQUIRED for real use:
                              # without it every restart forms a new network)
  permitJoin: false           # enable only while pairing new devices

mqtt:
  listen: ":1883"             # embedded broker for ESP32 bridges
                              # topics: <addr>/state (report), <addr>/set (command);
                              # addr defaults to home/<id> when omitted

devices:
  # Multi-gang Zigbee wall switch: one device per gang, same address.
  - {id: light_main,     name: "Main Light",     integration: zigbee, addr: "0x00158d0001abcd01", type: light, endpoint: 1}
  - {id: light_ambient,  name: "Ambient Light",  integration: zigbee, addr: "0x00158d0001abcd01", type: light, endpoint: 2}

  # A wall switch used as a button controller (decoupled mode): its presses
  # drive OTHER devices via the button rules below.
  - {id: button_1, name: "Wall Button", integration: zigbee, addr: "0x00158d0001abcd02", type: switch, decoupled: true}

  # Zigbee curtain motor (Window Covering cluster).
  - {id: curtain_1, name: "Curtain", integration: zigbee, addr: "0x00158d0001abcd03", type: cover}

  # Light-integrated ceiling fan behind one ESP32 bridge, modeled as TWO logical
  # devices so the light and the fan are controlled INDEPENDENTLY (HomeKit shows
  # a separate lightbulb and fan). The ESP32 subscribes to both set-topics.
  # level on the fan = speed 0..100. features opt the light into dimming/CCT/RGB
  # and the fan into reversible spin (a plain downlight omits features → on/off).
  - {id: ceiling_light, name: "Ceiling Light", integration: mqtt, addr: "home/ceiling/light", type: light, features: [brightness, colortemp, color]}
  - {id: ceiling_fan,   name: "Ceiling Fan",   integration: mqtt, addr: "home/ceiling/fan",   type: fan, features: [direction]}

  # ESP32 humidity sensor + a smart-plug dehumidifier.
  - {id: humidity_1,     name: "Humidity",     integration: mqtt, addr: "home/humidity_1",     type: humidity}
  - {id: dehumidifier_1, name: "Dehumidifier", integration: mqtt, addr: "home/dehumidifier_1", type: switch}

  # Devices behind the ESP32+CC1101 447 MHz RF bridge (rf-remote-analyzer's
  # rf_bridge firmware, flashed with MQTT_HOST = this hub). addr is the
  # firmware's DEVICE_ID. Transmit-only: state shown in HomeKit is optimistic.
  # See docs/rf-bridge.md.
  - id: living_ceiling_fan
    name: "거실 실링팬"
    integration: rf
    type: fan
    addr: rf447
    rf:
      # Remote layout (verified on hardware): 1-6 speed, 7 all-off,
      # 8 rotation-off, 9 LED (this fan has no light), 10 forward,
      # 11 natural breeze, 12 reverse, 13-15 timer 1H/2H/4H.
      buttons:
        off: 7
        # Six speeds spread over the HomeKit 0-100 slider; a level snaps to
        # the nearest one.
        speeds: {17: 1, 33: 2, 50: 3, 67: 4, 83: 5, 100: 6}
  - id: bedroom_blind
    name: "안방 블라인드"
    integration: rf
    type: cover
    addr: rf447
    rf:
      channel: 0              # which of the blind remote's 16 channels

  # Matter blind, natively controlled by the hub over CASE (go-matter).
  # Commission the device onto the hub's fabric first (e.g. with chip-tool),
  # then point fabricStore at the stored credentials. Omitting address resolves
  # the device over mDNS by node id.
  - id: blind_1
    name: "Blind"
    integration: matter
    type: cover
    driver: go-matter
    gomatter:
      fabricStore: ./matter-data/fabric.json
      nodeId: 1
      endpoint: 1

  # Alternative: a Matter device delegated to HomeKit (one-way triggers only).
  # - id: blind_2
  #   name: "Blind 2"
  #   integration: matter
  #   type: cover
  #   driver: delegated
  #   triggers: {open: blind2_open, close: blind2_close}

# Automation rules evaluated inside the hub.
rules:
  # Wall button (decoupled): single press toggles the ceiling light, double
  # press toggles the fan — each independently.
  - {type: button, src: button_1, press: single, dst: ceiling_light, action: toggle}
  - {type: button, src: button_1, press: double, dst: ceiling_fan,   action: toggle}
  # Alternatively, a paddle can CYCLE a device through steps instead of toggling
  # — how the bedroom fan is driven: one paddle steps off→3단(50)→6단(100)→off.
  # power resets the sequence when the fixture loses power (L1 relay / all-off).
  # - {type: cycle, src: button_1, press: single, dst: ceiling_light, states: [0, 50, 100]}
  # - {type: cycle, src: button_1, press: double, dst: ceiling_fan,   states: [0, 50, 100], power: light_main}
  # Hold opens the Matter blind (press it again from HomeKit to close).
  - {type: button, src: button_1, press: hold,   dst: blind_1,       action: open}
  # Humidity hysteresis: dehumidifier on at 65%, off at 55%.
  - {type: threshold, src: humidity_1, dst: dehumidifier_1, above: 65, below: 55}
