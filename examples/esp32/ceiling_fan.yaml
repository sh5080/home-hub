# ESPHome: light-integrated RF ceiling-fan bridge for the home-hub MQTT
# convention. One ESP32 drives BOTH the light and the fan, exposed to the hub
# as TWO independent devices (so HomeKit shows a separate lightbulb and fan):
#
#   configs/devices.yaml:
#     - {id: ceiling_light, integration: mqtt, addr: home/ceiling/light, type: light}
#     - {id: ceiling_fan,   integration: mqtt, addr: home/ceiling/fan,   type: fan}
#
# Topics: <addr>/set (hub → device), <addr>/state (device → hub).
# Replace the remote_transmitter codes with ones captured from your RF remote.

esphome:
  name: ceiling-fan-bridge

esp32:
  board: esp32dev

logger:

mqtt:
  broker: 192.168.1.10
  port: 1883
  discovery: false
  topic_prefix: null
  on_json_message:
    # LIGHT: home/ceiling/light/set  →  {"on": bool}
    - topic: home/ceiling/light/set
      then:
        - lambda: |-
            if (x.containsKey("on")) {
              id(light_is_on) = x["on"];
              if (x["on"]) id(light_on).press(); else id(light_off).press();
              id(publish_light).execute();
            }
    # FAN: home/ceiling/fan/set  →  {"on": bool, "level": 0..100}
    - topic: home/ceiling/fan/set
      then:
        - lambda: |-
            if (x.containsKey("on") && !x["on"]) { id(fan_off).press(); id(fan_level) = 0; }
            if (x.containsKey("level")) {
              int lvl = x["level"];
              if (lvl <= 0)      id(fan_off).press();
              else if (lvl < 34) id(fan_low).press();
              else if (lvl < 67) id(fan_med).press();
              else               id(fan_high).press();
              id(fan_level) = lvl;
            } else if (x.containsKey("on") && x["on"]) {
              id(fan_med).press(); id(fan_level) = 50;   // plain "on" → a default speed
            }
            id(publish_fan).execute();

globals:
  - {id: fan_level, type: int, restore_value: false, initial_value: '0'}
  - {id: light_is_on, type: bool, restore_value: false, initial_value: 'false'}

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 100%

# Placeholder RF codes — replace with codes captured from your remote.
button:
  - {platform: template, id: light_on,  on_press: {remote_transmitter.transmit_rc_switch_raw: {code: "000000000000000000001000", protocol: 1}}}
  - {platform: template, id: light_off, on_press: {remote_transmitter.transmit_rc_switch_raw: {code: "000000000000000000001001", protocol: 1}}}
  - {platform: template, id: fan_off,   on_press: {remote_transmitter.transmit_rc_switch_raw: {code: "000000000000000000000001", protocol: 1}}}
  - {platform: template, id: fan_low,   on_press: {remote_transmitter.transmit_rc_switch_raw: {code: "000000000000000000000010", protocol: 1}}}
  - {platform: template, id: fan_med,   on_press: {remote_transmitter.transmit_rc_switch_raw: {code: "000000000000000000000011", protocol: 1}}}
  - {platform: template, id: fan_high,  on_press: {remote_transmitter.transmit_rc_switch_raw: {code: "000000000000000000000100", protocol: 1}}}

# Track light state so the light's on/off can be reported and toggled.
script:
  - id: publish_light
    then:
      - lambda: |-
          // light_on/off presses set intent; mirror it here.
          // (For a real relay, read the relay's actual state instead.)
      - mqtt.publish_json:
          topic: home/ceiling/light/state
          payload: 'root["on"] = id(light_is_on);'
  - id: publish_fan
    then:
      - mqtt.publish_json:
          topic: home/ceiling/fan/state
          payload: |-
            root["on"] = id(fan_level) > 0;
            root["level"] = id(fan_level);
